version: '3'

services:
  postgresql:
    image: 'bitnami/postgresql'
    ports:
      - '5432:5432'
    environment:
      - POSTGRESQL_USERNAME=docker
      - POSTGRESQL_PASSWORD=docker
      - POSTGRESQL_DATABASE=dbPointControl
    volumes:
      - 'postgresql_data:/bitnami/postgresql'

  redis:
    container_name: redis
    image: 'redis:alpine'
    ports:
      - '6379:6379'

  api:
    container_name: point-control-api
    image: point-control-api:1.0
    build:
      context: .
      args:
        APP_PORT: 5000
    restart: always
    ports:
      - 5000:5000
    depends_on:
      - redis
      - postgresql

volumes:
  postgresql_data:
    driver: local
